    <section id="home" class="tournament-hub scores-digest">
        <div class="hub-container">
            <div class="hub-header">
                <div class="hub-title-group">
                    <p class="hub-eyebrow" id="hubEyebrow">Scores</p>
                    <h1 class="hub-title" id="hubTournamentName">Scores</h1>
                    <p class="section-subtitle" id="hubPageSub">ATP scores update as matches progress.</p>
                    <div class="hub-meta-row" id="hubMeta">
                        <span id="hubSurface" class="surface-pill" hidden></span>
                    </div>
                </div>
            </div>

            <div class="digest-toolbar" id="digestToolbar">
                <div class="tour-toggle" id="tourToggle" role="group" aria-label="Tour">
                    <button type="button" class="tour-btn" data-tour="ATP" aria-pressed="true">ATP</button>
                    <button type="button" class="tour-btn" data-tour="WTA" aria-pressed="false">WTA</button>
                </div>
                <div class="digest-chips" id="digestChips" role="tablist" aria-label="Match filter">
                    <button type="button" class="digest-chip" data-filter="live" aria-pressed="false">Live <span class="digest-chip-count" data-count-for="live">0</span></button>
                    <button type="button" class="digest-chip" data-filter="upcoming" aria-pressed="false">Upcoming</button>
                    <button type="button" class="digest-chip" data-filter="finished" aria-pressed="false">Finished</button>
                    <button type="button" class="digest-chip is-active" data-filter="all" aria-pressed="true">All</button>
                </div>
                <div class="digest-status">
                    <span class="live-status-pill" id="liveStatusPill">No live matches</span>
                    <span class="digest-updated" id="digestUpdated" aria-live="polite"></span>
                </div>
            </div>

            <section class="scores-list-section" id="scoresSection">
                <div class="scores-list" id="scoresList" aria-live="polite" aria-label="Match scores">
                    <div class="digest-loading">Loading match data…</div>
                </div>
            </section>
        </div>
    </section>
